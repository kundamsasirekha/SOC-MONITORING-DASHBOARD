<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d1117;
color:white;
display:flex;
}

.sidebar{
width:240px;
height:100vh;
background:#161b22;
position:fixed;
left:0;
top:0;
}

.sidebar h2{
text-align:center;
padding:20px;
color:cyan;
border-bottom:1px solid gray;
}

.sidebar a{
display:block;
padding:15px 20px;
text-decoration:none;
color:white;
font-size:18px;
}

.sidebar a:hover{
background:cyan;
color:black;
}

.main{
margin-left:240px;
width:calc(100% - 240px);
padding:30px;
}

.header{
background:#161b22;
padding:20px;
text-align:center;
font-size:30px;
color:cyan;
border-radius:10px;
box-shadow:0 0 10px cyan;
margin-bottom:30px;
}

.form-box{
width:500px;
margin:auto;
background:#161b22;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px cyan;
}

.form-box h2{
text-align:center;
color:cyan;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
margin-bottom:5px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:6px;
font-size:16px;
}

button{
margin-top:25px;
width:100%;
padding:12px;
background:cyan;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#00bcd4;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>👤 USER PANEL</h2>

<a href="/user-dashboard">🏠 Dashboard</a>

<a href="/profile">👤 My Profile</a>

<a href="/login-history">📜 Login History</a>

<a href="/notifications">🔔 Notifications</a>

<a href="/change-password">⚙️ Change Password</a>

<a href="/logout">🚪 Logout</a>

</div>

<div class="main">

<div class="header">
🔒 Change Password
</div>

<div class="form-box">

<h2>Update Password</h2>

<form action="/update-password" method="POST">

<label>Current Password</label>
<input type="password" name="old_password" placeholder="Enter Current Password" required>

<label>New Password</label>
<input type="password" name="new_password" placeholder="Enter New Password" required>

<label>Confirm Password</label>
<input type="password" name="confirm_password" placeholder="Confirm New Password" required>

<button type="submit">
Update Password
</button>

</form>

</div>

</div>

</body>
</html>
