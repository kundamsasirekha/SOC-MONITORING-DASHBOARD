<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SOC Monitoring Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d1117;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
background:#161b22;
padding:50px;
border-radius:12px;
text-align:center;
box-shadow:0 0 20px cyan;
width:420px;
}

h1{
color:cyan;
margin-bottom:15px;
}

p{
color:#ccc;
margin-bottom:35px;
}

button{
width:100%;
padding:15px;
margin:10px 0;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
transition:.3s;
}

.admin{
background:#00bcd4;
color:white;
}

.admin:hover{
background:#0097a7;
}

.user{
background:#4caf50;
color:white;
}

.user:hover{
background:#388e3c;
}

</style>

</head>

<body>

<div class="container">

<h1>🔐 SOC Monitoring Dashboard</h1>

<p>Select Login Type</p>

<button class="admin"
onclick="window.location.href='/admin-login'">
👨‍💼 Admin Login
</button>

<button class="user"
onclick="window.location.href='/user-login'">
👤 User Login
</button>

</div>

</body>
</html>
