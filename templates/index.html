<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOC Monitoring System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0d1117;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
}

.container{
    width:420px;
    text-align:center;
}

h1{
    color:#00ffff;
    margin-bottom:10px;
}

h3{
    margin-bottom:30px;
    color:#cccccc;
}

.cards{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:30px;
}

.card{
    width:100%;
    background:#161b22;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px cyan;
    transition:.3s;
}

.card:hover{
    transform:scale(1.03);
}

.card h2{
    color:#00ffff;
    margin-bottom:15px;
}

.card p{
    color:#cccccc;
    margin-bottom:20px;
    line-height:25px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#00bcd4;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0097a7;
}

a{
    text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h1>🔐 SOC Monitoring System</h1>
<h3>Select Login Type</h3>

<div class="cards">

<div class="card">

<h2>👨‍💼 Admin</h2>

<p>
Manage security events,<br>
alerts and users.
</p>

<a href="/admin-login">
<button>Admin Login</button>
</a>

</div>

<div class="card">

<h2>👤 User</h2>

<p>
View personal dashboard<br>
and login history.
</p>

<a href="/user-login">
<button>User Login</button>
</a>

</div>

</div>

</div>

</body>
</html>
