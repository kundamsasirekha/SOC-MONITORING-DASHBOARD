<!DOCTYPE html>
<html>
<head>
<title>Notifications</title>
<style>
body{
background:#0d1117;
color:white;
font-family:Arial;
}

.container{
width:80%;
margin:auto;
margin-top:40px;
}

.card{
background:#161b22;
padding:20px;
margin:15px 0;
border-left:5px solid cyan;
border-radius:8px;
}

h1{
text-align:center;
color:cyan;
}

a{
color:white;
text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<h1>🔔 Notifications</h1>

<div class="card">
<h3>Login Successful</h3>
<p>Your account was logged in successfully.</p>
</div>

<div class="card">
<h3>Password Updated</h3>
<p>Your password was changed successfully.</p>
</div>

<div class="card">
<h3>Security Alert</h3>
<p>No suspicious login activity detected.</p>
</div>

<br>

<a href="/user-dashboard">⬅ Back to Dashboard</a>

</div>

</body>
</html>
