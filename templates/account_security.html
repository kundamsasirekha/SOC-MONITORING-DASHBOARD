<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account Security</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d1117;
color:white;
}

.container{
width:70%;
margin:40px auto;
background:#161b22;
padding:30px;
border-radius:10px;
box-shadow:0 0 15px cyan;
}

h1{
text-align:center;
color:cyan;
margin-bottom:30px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:cyan;
color:black;
padding:15px;
}

td{
padding:15px;
border:1px solid gray;
}

.safe{
color:lightgreen;
font-weight:bold;
}

.warning{
color:orange;
font-weight:bold;
}

.back{
margin-top:30px;
text-align:center;
}

.back a{
text-decoration:none;
background:cyan;
color:black;
padding:12px 25px;
border-radius:8px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>🛡️ Account Security</h1>

<table>

<tr>
<th>Security Item</th>
<th>Status</th>
</tr>

<tr>
<td>Account Status</td>
<td class="safe">✅ Secure</td>
</tr>

<tr>
<td>Last Login</td>
<td>26-07-2026 09:15 AM</td>
</tr>

<tr>
<td>Last Password Change</td>
<td>20-07-2026</td>
</tr>

<tr>
<td>Failed Login Attempts</td>
<td>0</td>
</tr>

<tr>
<td>Security Score</td>
<td class="safe">95%</td>
</tr>

<tr>
<td>Firewall Protection</td>
<td class="safe">Enabled</td>
</tr>

<tr>
<td>Multi-Factor Authentication</td>
<td class="safe">Enabled</td>
</tr>

<tr>
<td>Suspicious Activity</td>
<td class="safe">No Threats Detected</td>
</tr>

</table>

<div class="back">

<a href="/user-dashboard">⬅ Back to Dashboard</a>

</div>

</div>

</body>
</html>
