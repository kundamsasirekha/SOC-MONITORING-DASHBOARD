<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        body {
            background: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .login-box {
            width: 400px;
            background: #161b22;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px cyan;
            text-align: center;
        }

        h1 {
            color: cyan;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: cyan;
            color: black;
            font-size: 18px;
            cursor: pointer;
            border-radius: 6px;
        }

        button:hover {
            background: #00bcd4;
        }

        a {
            color: white;
            text-decoration: none;
        }
    </style>

</head>

<body>

    <div class="login-box">

        <h1>👨‍💼 Admin Login</h1>

        <form action="/admin-auth" method="POST">

            <input
                type="text"
                name="username"
                placeholder="Admin Username"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit">
                Login
            </button>

        </form>

        <br>

        <a href="/">⬅ Back</a>

    </div>

</body>

</html>
