<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#0d1117;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            color:white;
        }

        .login-box{
            width:420px;
            background:#161b22;
            padding:40px;
            border-radius:10px;
            box-shadow:0 0 20px cyan;
            text-align:center;
        }

        h1{
            color:cyan;
            margin-bottom:30px;
        }

        input{
            width:100%;
            padding:12px;
            margin:12px 0;
            border:none;
            border-radius:6px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            background:cyan;
            color:black;
            font-size:18px;
            border-radius:6px;
            cursor:pointer;
            font-weight:bold;
        }

        button:hover{
            background:#00bcd4;
        }

        .credentials{
            margin-top:25px;
            background:#0d1117;
            border:1px solid cyan;
            border-radius:8px;
            padding:15px;
            text-align:left;
        }

        .credentials h3{
            color:cyan;
            text-align:center;
            margin-bottom:12px;
        }

        .credentials p{
            margin:8px 0;
            font-size:16px;
        }

        a{
            display:inline-block;
            margin-top:20px;
            color:white;
            text-decoration:none;
        }

        a:hover{
            color:cyan;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>👨‍💼 Admin Login</h1>

    <form action="/admin-auth" method="POST">

        <input
            type="text"
            name="username"
            placeholder="Enter Admin Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required>

        <button type="submit">Login</button>

    </form>

    <div class="credentials">

        <h3>🔑 Demo Admin Credentials</h3>

        <p><b>Username:</b> admin</p>

        <p><b>Password:</b> admin123</p>

    </div>

    <a href="/">⬅ Back to Home</a>

</div>

</body>
</html>
