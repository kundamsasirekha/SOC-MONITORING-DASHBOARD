<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>

<style>

body{
background:#0d1117;
color:white;
font-family:Arial;
}

.container{
width:500px;
margin:60px auto;
background:#161b22;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px cyan;
}

h1{
text-align:center;
color:cyan;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
}

input{
width:100%;
padding:10px;
margin-top:5px;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:cyan;
border:none;
cursor:pointer;
}

a{
display:block;
text-align:center;
margin-top:20px;
color:white;
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h1>⚙ Admin Settings</h1>

<label>Admin Name</label>
<input type="text" value="Administrator">

<label>Email</label>
<input type="email" value="admin@soc.com">

<label>Change Password</label>
<input type="password">

<button>Save Settings</button>

<a href="/admin-dashboard">⬅ Back to Dashboard</a>

</div>

</body>
</html>
