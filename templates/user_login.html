<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d1117;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:#161b22;
padding:40px;
width:380px;
border-radius:10px;
box-shadow:0 0 15px cyan;
text-align:center;
}

h2{
color:cyan;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:6px;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:cyan;
color:black;
font-size:18px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#00bcd4;
}

.back{
display:block;
margin-top:20px;
color:white;
text-decoration:none;
}

</style>

</head>

<body>

<div class="login-box">

<h2>👤 User Login</h2>

<form action="/user-auth" method="POST">

<input
type="text"
name="username"
placeholder="Enter Username"
required>

<input
type="password"
name="password"
placeholder="Enter Password"
required>


<button type="submit">
Login
</button>

</form>

<a href="/" class="back">⬅ Back</a>

</div>

</body>
</html>
