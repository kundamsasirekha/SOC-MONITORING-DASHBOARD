<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threat Analytics</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d1117;
color:white;
}

.header{
background:#161b22;
padding:20px;
text-align:center;
font-size:28px;
color:cyan;
}

.container{
width:90%;
margin:30px auto;
}

.card{
background:#161b22;
padding:20px;
margin-bottom:25px;
border-radius:10px;
box-shadow:0 0 10px cyan;
}

canvas{
background:white;
border-radius:10px;
padding:10px;
}

.back{
text-align:center;
margin-top:30px;
}

.back a{
background:#00bcd4;
color:white;
padding:12px 25px;
text-decoration:none;
border-radius:8px;
}

</style>

</head>

<body>

<div class="header">
📊 Threat Analytics
</div>

<div class="container">

<div class="card">
<h2>Weekly Security Alerts</h2>
<br>
<canvas id="barChart"></canvas>
</div>

<div class="card">
<h2>Attack Distribution</h2>
<br>
<canvas id="pieChart"></canvas>
</div>

<div class="back">
<a href="/admin-dashboard">⬅ Back to Dashboard</a>
</div>

</div>

<script>

new Chart(document.getElementById("barChart"),{

type:"bar",

data:{
labels:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
datasets:[{
label:"Security Alerts",
data:[15,22,10,18,30,12,25]
}]
}

});

new Chart(document.getElementById("pieChart"),{

type:"pie",

data:{

labels:["Malware","SQL Injection","Brute Force","DDoS"],

datasets:[{

data:[30,25,20,25]

}]

}

});

</script>

</body>
</html>
