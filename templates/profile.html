<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d1117;
color:white;
display:flex;
}

.sidebar{
width:240px;
height:100vh;
background:#161b22;
position:fixed;
left:0;
top:0;
}

.sidebar h2{
text-align:center;
padding:20px;
color:cyan;
border-bottom:1px solid gray;
}

.sidebar a{
display:block;
padding:15px 20px;
color:white;
text-decoration:none;
font-size:18px;
transition:.3s;
}

.sidebar a:hover{
background:cyan;
color:black;
}

.main{
margin-left:240px;
width:calc(100% - 240px);
padding:30px;
}

.header{
background:#161b22;
padding:20px;
text-align:center;
font-size:28px;
color:cyan;
border-radius:10px;
box-shadow:0 0 10px cyan;
margin-bottom:30px;
}

.profile-card{
width:650px;
margin:auto;
background:#161b22;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px cyan;
}

.profile-card h2{
text-align:center;
color:cyan;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
margin-bottom:8px;
font-size:18px;
}

input{
display:block;
width:100%;
padding:12px;
border:none;
border-radius:6px;
font-size:16px;
margin-bottom:15px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:cyan;
color:black;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#00bcd4;
}

.saved{
margin-top:30px;
padding:20px;
border:1px solid cyan;
border-radius:10px;
background:#0f1720;
}

.saved h3{
color:cyan;
margin-bottom:15px;
}

.saved p{
margin:10px 0;
font-size:18px;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>👤 USER PANEL</h2>

<a href="/user-dashboard">🏠 Dashboard</a>
<a href="/profile">👤 My Profile</a>
<a href="/login-history">📜 Login History</a>
<a href="/notifications">🔔 Notifications</a>
<a href="/change-password">⚙️ Change Password</a>
<a href="/logout">🚪 Logout</a>

</div>

<div class="main">

<div class="header">
👤 My Profile
</div>

<div class="profile-card">

<h2>Employee Profile</h2>

<form action="/save-profile" method="POST">

<label>Name</label>
<input
type="text"
name="name"
placeholder="Enter Your Name"
required>

<label>Email</label>
<input
type="email"
name="email"
placeholder="Enter Your Email"
required>

<label>Phone Number</label>
<input
type="text"
name="phone"
placeholder="Enter Phone Number"
required>

<label>Department</label>
<input
type="text"
name="department"
placeholder="Enter Department"
required>

<button type="submit">
💾 Save Profile
</button>

</form>


</body>
</html>
